function normalizedGraphEdges(nodes,edges=[]){

}
function edgesFromNodes(nodes){return normalizedGraphEdges(nodes,nodes.flatMap(n=>(n.dependencies||[]).map(from=>({from,to:n.id,type:'dependency',enabled:true}))));}
function graphOrder(nodes,edges=[]){

}
function flowCanvasMarkup(id,html,edges,{label='流程关系图',columns=3,kind='board'}={}){

async function studioSave(action){

 try{
  const body={config:studio.draft,expectedVersion:studio.draft.version};
  if(action==='preview'){
   const preview=await api('blueprints/preview',{body});
   if(stillAuthorized()){studio.preview=preview;render();}return;
  }
  const result=await api('blueprints/'+action,{body,key:studio.requestKey||(studio.requestKey=crypto.randomUUID(),persistStudio(),studio.requestKey)});
  if(!stillAuthorized())return;
  studio.draft=result.draft;studio.dirty=false;studio.requestKey=null;persistStudio();
  if(result.published){
   studio.active=result.published;const catalog=await api('catalog');
   if(!stillAuthorized())return;state.catalog=catalog;
   toast(result.published.defaultRoute?'新流程已发布，新任务按此顺序自动交接。':'模块顺序已发布，自动顺序交接未开启。'+(result.published.branches?.some(rule=>rule.enabled)?' 已启用的条件分支继续生效。':''));
  }else toast('流程草稿已保存。');
  const resultView=await api('blueprints');
  if(stillAuthorized()){studio.revisions=resultView.revisions;render();}
 }catch(e){if(stillAuthorized())toast(e.message+' 草稿已保留。');}
 finally{if(scope===flowAccessScope()){studio.saving=false;if(state.view==='studio')render();}}
}

async function openTask(id,{keep=false}={}){if(!canUseTaskWorkspace())return;const request=++taskRequest;if(!keep){state.task=null;lastFocus=document.activeElement;openDrawer(drawerHeader('正在读取任务','请稍候','保留原任务与交付版本。'));}try{const task=await api('runs/'+id);if(request!==taskRequest)return;state.task=task;state.stage=null;if(!keep)state.openNodes=new Set(task.runtime.nodes.filter(n=>n.state==='ready').map(n=>n.id));history.replaceState({},'',location.pathname+'?task='+encodeURIComponent(id));renderTask();}catch(e){if(request!==taskRequest)return;openDrawer(drawerHeader('读取尚未完成','任务资料已保留',e.message)+`<div class="drawer-body"><button class="button" data-task="${esc(id)}">重新读取原任务</button></div>`);}}

function canStartDownstreamNow(t){const policy={'00':'W00.S4.E1','05':'W05.S5.E1'};if(!policy[t.workflow]||t.runtime.state!=='running'||t.runtime.automation)return false;const n=t.runtime.nodes.find(n=>n.id===policy[t.workflow]);if(n?.state!=='ready')return false;const seen=new Set(),complete=node=>(node.dependencies||[]).every(key=>{if(seen.has(key))return true;seen.add(key);const prior=t.runtime.nodes.find(x=>x.id===key);return prior?.state==='completed'&&complete(prior);});return complete(n);}

function labelControls(root){root.querySelectorAll('select').forEach(s=>{const title=s.closest('label')?.querySelector('span')?.textContent;if(title&&!s.hasAttribute('aria-label'))s.setAttribute('aria-label',title);});}
function setupSubmit(build,send,onSuccess){const form=$('#edit-form');let savedSignature='',requestKey='';form.onsubmit=async e=>{e.preventDefault();if(form.dataset.busy==='true')return;const box=$('#form-error');box.hidden=true;try{const body=build(new FormData(form)),signature=JSON.stringify(body);if(signature!==savedSignature){requestKey=crypto.randomUUID();savedSignature=signature;}form.dataset.busy='true';form.querySelectorAll('button').forEach(b=>b.disabled=true);const result=await send(body,requestKey);form.dataset.busy='false';$('#modal').close();await onSuccess(result);}catch(e){box.textContent=e.message+' 已保留本次填写内容。';box.hidden=false;}finally{form.dataset.busy='false';form.querySelectorAll('button').forEach(b=>b.disabled=false);}};}
async function openAction(action,nodeId){const t=state.task,n=t?.runtime.nodes.find(n=>n.id===nodeId);if(!t)return;if(action==='complete'&&(n.canReuseUpstreamEvidence||!['platform_receipt','cloud_review','remix_output','cloud_return'].includes(n.evidenceKind)))return openDeliveryAction(t,n);const title={complete:'提交当前节点的交付',return:'退回上游补充',assign:'调整节点主责',extend:'调整节点办理时限',pause:'暂停这项工作',resume:'恢复这项工作',cancel:'终止这项工作'}[action];let body='';if(action==='complete')body=`<p class="help">完成标准：${esc(n.done)}</p><div class="form-grid"><label class="field wide"><span>交付凭证链接</span><input name="url" type="url" required placeholder="飞书交付文档 / 业务系统中的准确版本链接"></label>${field('交付编号','reference','text','maxlength="200" placeholder="任务、文件或审核记录编号"')}${field('交付版本','version','text','maxlength="100" placeholder="如 v2、审核版本号或文件校验值"')}</div><p class="help">本次提交会记录你的确认结论。系统记录尚未完成的，先在业务工作台完成并核对。</p>`;
 if(action==='complete'&&n.evidenceKind==='platform_receipt')body=`<p class="help">系统会使用你的当前权限核对云管家保存的平台回执，并锁定本任务的资产、文件版本、账户和计划。目标关联成功与平台审核通过分别记录；最终回执节点需核验对应素材的审核 PASS，拒绝或未知状态保留待核验，不代表已可投。</p><div class="form-grid">${field('千川推送任务编号','reference')}${field('云管家资产编号','assetId','number','min="1"')}${field('本次目标广告账户 ID','accountId')}${field('本次目标计划 ID','planId')}</div>`;
 else if(action==='complete'&&n.evidenceKind==='cloud_review'&&n.id.startsWith('W03.'))body=`<p class="help">请填写本次交付在云管家的准确资产与审核版本。当前审核通过且文件版本一致后，才能继续流转。</p><div class="form-grid">${field('云管家资产编号','assetId','number','min="1"')}${field('当前审核版本号','version','number','min="1"')}</div>`;
 else if(action==='complete'&&['remix_output','cloud_return','cloud_review'].includes(n.evidenceKind)){
  try{state.sources=await api(state.overview.access.canManage?'sources':'runs/'+t.id+'/sources?nodeId='+encodeURIComponent(n.id));}catch(e){toast(e.message);return;}
  const versions=(state.sources?.renders||[]).filter(r=>!t.runtime.product||sameFlowProduct(r.product,t.runtime.product)).flatMap(r=>r.variants.filter(v=>!v.conflict&&!v.quarantined).map(v=>[r.id+'|'+v.id,`${r.product} · ${v.name||v.id} · ${v.returnVerified?'回传已核验':'成片已生成'}`]));
  body=`<p class="help">请选择本任务对应的原成片。提交时核对制作编号、文件校验值、回传与审核记录，保持同一版本连续交付。</p><label class="field"><span>制作成片版本</span><select name="renderSelection" required><option value="">选择准确的交付版本</option>${options(versions)}</select></label>${versions.length?'':'<p class="alert-box">当前尚无符合条件的可见成片，请先在二创工作台完成生产并核对权限。</p>'}`;
 }
 if(action==='return'){const upstream=new Set();function visit(id){const x=t.runtime.nodes.find(n=>n.id===id);for(const d of x.dependencies)if(!upstream.has(d)){upstream.add(d);visit(d);}}visit(n.id);body=`<label class="field"><span>退回到哪个已完成的上游节点</span><select name="targetNodeId" required>${options(t.runtime.nodes.filter(n=>upstream.has(n.id)&&n.state==='completed').map(n=>[n.id,n.title]))}</select></label><p class="help">将保留旧交付和操作记录，受影响的下游需要基于新版本重新确认。</p>`;}
 if(action==='assign'){try{state.people=(await api('people')).items;}catch(e){toast(e.message);return;}body=`<label class="field"><span>新的节点主责</span><select name="owner" required>${peopleOptions(n.owner.number)}</select></label>`;}
 if(action==='extend')body=field('新的截止时间（北京时间）','dueAt','datetime-local');
 if(action==='pause')body='<p class="help">暂停期间不触发节点超时提醒。恢复后顺延未完成节点的剩余时限，并重新提醒当前主责。</p>';
 if(action==='cancel')body='<p class="help">终止后停止继续流转，保留所有资料、版本和过程记录。请填写明确的业务原因。</p>';
 showModal(title,n?.title||t.title,body+`<label class="field" style="margin-top:17px"><span>${action==='complete'?'交付结论':'办理原因与说明'}</span><textarea name="note" required maxlength="1500" placeholder="请记录可供接收人理解的具体说明。"></textarea></label>`,action==='complete'?'保存交付并流转':'保存操作');
 setupSubmit(f=>({expectedVersion:t.version,nodeId:n?.id,note:f.get('note'),...(action==='complete'?{evidence:[{kind:n.evidenceKind||'human_attested',url:f.get('url'),reference:f.get('reference'),version:f.get('version'),summary:f.get('note'),assetId:f.get('assetId'),accountId:f.get('accountId'),planId:f.get('planId'),renderId:String(f.get('renderSelection')||'').split('|')[0],variantId:String(f.get('renderSelection')||'').split('|')[1]}]}:{}),...(action==='return'?{targetNodeId:f.get('targetNodeId')}:{}),...(action==='assign'?{owner:f.get('owner')}:{}),...(action==='extend'?{dueAt:new Date(f.get('dueAt')+':00+08:00').toISOString()}:{} )}),(body,key)=>api(`runs/${t.id}/${action}`,{body,key}),async result=>{state.task=result;renderTask();toast(action==='complete'?'交付已保存，任务已继续流转。':'操作已保存。');await refresh();});}
function showProduct(product){taskRequest++;state.task=null;state.stage=null;const rs=state.sources.renders.filter(r=>r.product===product);openDrawer(drawerHeader('双品自动化 · 成片证据',product,'按制作编号、文件校验值与回传编号关联。')+`<div class="drawer-body">${rs.length?rs.map(r=>`<details><summary>${esc(r.name||r.id)} · ${r.variants.length} 个版本</summary><p class="help">${fmt(r.createdAt)} · ${esc(r.id)}</p>${r.variants.map(v=>`<div class="notice-row"><b>${esc(v.name||v.id)}</b><p>${v.conflict?pill('审核状态冲突','red'):v.quarantined?pill('平台退回待处理','red'):pill(v.review==='approved'?'成片审核通过':'成片待处理',v.review==='approved'?'green':'amber')} ${pill(v.returnVerified?'回传已核验':'回传待核验',v.returnVerified?'green':'')}</p><p class="help">切片 ${v.sourceClipCount} 个 · ${v.duration??'待核验'} 秒 · ${v.cloudReview?'云端审核 '+v.cloudReview.status:'云端审核待核验'}<br>内容复核：${esc(v.visualReview?.summary||'尚无自动内容复核凭证，不能据此判为L4自动合格')}<br>资产 ${v.return?.assetId||'待回补'}<br>校验值 <code>${esc(v.sha256||'待回补')}</code></p>${v.receipts.map(x=>`<p class="help">千川任务 ${x.id} · ${x.verified?'关联已核验':'关联待核验'} · ${esc(x.platformAudit?.label||'平台审核待核验')}<br>账户 ${esc(x.account)} · 计划 ${esc(x.plan)}<br>素材 ${esc(x.video)}</p>`).join('')}</div>`).join('')}</details>`).join(''):empty('暂无可见成片','新成片产生后会自动出现在这里。')}${moduleLink('02')}</div>`);}
async function refresh({initial=false}={}){if(state.loading)return;state.loading=true;$('#refresh').disabled=true;try{const o=await api('overview'),wasManager=state.overview?.access.canManage;state.overview=o;if(o.access.canManage||o.access.canConfigure){const [s,c]=await Promise.all([o.access.canManage?api('sources'):Promise.resolve(null),api('catalog')]);state.sources=s;state.catalog=c;if(initial&&!new URLSearchParams(location.search).has('task')&&new URLSearchParams(location.search).get('view')!=='tasks')state.view='board';}else{state.sources=null;state.people=[];state.catalog={...(o.taskCatalog||{flows:[],stages:[]}),edges:[]};state.view='tasks';state.stage=null;if(wasManager){state.task=null;taskRequest++;$('#drawer').hidden=true;$('#workspace').classList.remove('with-drawer');if($('#modal').open)closeModal();}}error('');render();if(state.task&&!$('#modal').open){const id=state.task.id,request=taskRequest,task=await api('runs/'+id);if(request===taskRequest&&state.task?.id===id){state.task=task;const scroll=$('#drawer').scrollTop;renderTask();$('#drawer').scrollTop=scroll;}}}catch(e){if(e.status===403||e.status===401){state.task=null;state.catalog=null;state.sources=null;state.overview=null;taskRequest++;$('#drawer').hidden=true;$('#board-tab').hidden=true;$('#studio-tab').hidden=true;$('#activity-tab').hidden=true;$('#new-run').hidden=true;$('#status-strip').hidden=true;$('#filters').hidden=true;$('#content').innerHTML=empty('请重新核对登录权限',e.message);}else{error(e.message+' 当前已展示的记录会保留，恢复连接后再刷新。');if(initial)$('#content').innerHTML=empty('工作连接尚未完成',e.message,'<a class="button primary" href="'+BASE+'">返回中枢确认登录</a>');}}finally{state.loading=false;$('#refresh').disabled=false;}}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b||b.disabled)return;try{
 if(b.dataset.personalFilter){state.personalFilter=b.dataset.personalFilter;state.personalPage=1;render();}if(b.dataset.personalPage){state.personalPage=Math.max(1,Number(b.dataset.personalPage));render();}if(b.dataset.view){if(!state.overview?.access.canManage&&b.dataset.view!=='tasks')return;state.view=b.dataset.view;state.search='';$('#search').value='';render();}
 if(b.dataset.flow){state.flow=b.dataset.flow;state.canvasLevel=state.flow==='all'?'flows':'stages';state.canvasStage=null;render();}if(b.dataset.shift)$('#content').scrollBy({left:Number(b.dataset.shift)*320,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
 if(b.id==='connect-creative')await openCreativeConnect();
 if(b.id==='mine'){state.mine=!state.mine;render();}
 if(b.dataset.stage)openStage(b.dataset.stage);
 if(b.dataset.task)await openTask(b.dataset.task);if(b.dataset.handoff)await (b.dataset.handoff==='existing'?openExistingHandoff():openHandoff(b.dataset.handoff));if(b.dataset.watch)await openWatch(b.dataset.watch);
 if(b.dataset.node){state.openNodes.has(b.dataset.node)?state.openNodes.delete(b.dataset.node):state.openNodes.add(b.dataset.node);if(state.task)renderTask();else{const s=state.catalog.stages.find(s=>s.id===state.stage);const scroll=$('#drawer').scrollTop;$('#drawer .drawer-body').innerHTML=`<div class="drawer-summary"><b>这一环节要交付</b><br>${esc(s.output)}</div>${s.steps.map((n,i)=>nodeHtml(n,i)).join('')}<div class="actions">${moduleLink(s.flow)}</div>`;$('#drawer').scrollTop=scroll;}}
 if(b.hasAttribute('data-close-drawer'))closeDrawer();
 if(b.hasAttribute('data-close-modal'))closeModal();
 if(b.dataset.new||b.id==='new-run')await openCreate(b.dataset.new||'00');
 if(b.dataset.action)await openAction(b.dataset.action,b.dataset.nodeId);
 if(b.dataset.product)showProduct(b.dataset.product);
 if(b.id==='refresh'){await refresh({initial:!state.catalog});if(state.task)await openTask(state.task.id,{keep:true});}
 if(b.dataset.notice){b.disabled=true;try{await api('notifications/'+b.dataset.notice+'/retry',{body:{}});toast('原通知已进入重试队列。');await openTask(state.task.id,{keep:true});}finally{b.disabled=false;}}
 }catch(err){toast(err.message);}});
$('#search').addEventListener('input',e=>{state.search=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(render,160);});
$('#modal').addEventListener('cancel',e=>{if($('#edit-form')?.dataset.busy==='true')e.preventDefault();});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!$('#modal').open){e.preventDefault();$('#search').focus();}if(e.key==='Escape'&&!$('#modal').open&&!$('#drawer').hidden)closeDrawer();});
await refresh({initial:true});const deepTask=new URLSearchParams(location.search).get('task');if(deepTask&&state.catalog)await openTask(deepTask);
setInterval(()=>{if(!document.hidden&&state.view!=='studio'&&!$('#modal').open)void refresh();},30000);
</script></body></html>
