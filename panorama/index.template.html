<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>流程引擎 · WIS 品牌营销部</title><style>/*STYLE*/</style></head><body>
<header class="topbar"><a class="brand" data-hub-home href="../"><span class="brandmark">W</span><span>WIS 品牌营销部<small>中枢 · 流程引擎</small></span></a><div class="header-right"><span id="identity">正在确认身份…</span><a class="button quiet" data-hub-home href="../">返回中枢 ↗</a></div></header>

<div class="workspace" id="workspace"><main id="content" tabindex="-1"><div class="empty"><span class="loader"></span><h2>正在连接中枢</h2><p>任务和人员将按你的实际权限加载。</p></div></main><aside id="drawer" aria-label="执行节点详情" hidden></aside></div>
<dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog><div id="toast" role="status" aria-live="polite" hidden></div>
